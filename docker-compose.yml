services:
  db:
    image: postgres:16-alpine
    container_name: arcade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arcade
    ports:
      - "5432:5432"
    volumes:
      - arcade-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d arcade"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  arcade-db-data:
